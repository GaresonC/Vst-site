<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MF AMP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      max-width: 600px;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .tagline {
      font-size: 1.1rem;
      color: #888;
      margin-bottom: 2.5rem;
    }

    .description {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #aaa;
      margin-bottom: 2.5rem;
    }

    .download-btn {
      display: inline-block;
      padding: 0.85rem 2.5rem;
      background: #fff;
      color: #0a0a0a;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 6px;
      transition: background 0.2s, transform 0.2s;
    }

    .download-btn:hover {
      background: #ccc;
      transform: translateY(-1px);
    }

    .version {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #555;
    }

    footer {
      padding: 2rem;
      font-size: 0.75rem;
      color: #444;
    }

    footer a {
      color: #666;
      text-decoration: none;
    }

    footer a:hover { color: #aaa; }
  </style>
</head>
<body>
  <main>
    <h1>MF AMP</h1>
    <p class="tagline">High-gain amp sim for modern metal</p>
    <p class="description">
      A free guitar amplifier plugin for modern metal. VST3, Windows.
    </p>
    <a class="download-btn" href="https://github.com/GaresonC/Guitar-VST/releases/latest">
      Download
    </a>
    <p class="version">VST3 &middot; Windows</p>
  </main>
  <footer>
    <a href="https://github.com/GaresonC">GitHub</a>
    &middot;
    <a href="/gallery.html">Gallery</a>
    &middot;
    <a href="/games/cv-navigation-demo/">Games</a>
  </footer>
</body>
</html>
