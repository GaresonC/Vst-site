<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CV SPACE CRUISE (proof of concept)</title>
<style>
  html, body {
    margin: 0;
    background: #05070a;
    color: #cfd6de;
    font-family: 'Courier New', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  canvas {
    background: #000;
    display: block;
    cursor: default;
    border: 1px solid #222;
  }
  h1 {
    font-size: 15px;
    letter-spacing: 2px;
    color: #8fa2b3;
    font-weight: normal;
    margin: 6px 0 0 0;
  }
  p.hint {
    font-size: 12px;
    color: #556170;
    margin: 0 0 6px 0;
    max-width: 1200px;
    text-align: center;
  }
  #levelTabs {
    display: flex;
    gap: 8px;
  }
  .lvlBtn {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    background: #10141a;
    color: #6d7885;
    border: 1px solid #2a323b;
    padding: 5px 14px;
    cursor: pointer;
  }
  .lvlBtn:hover {
    color: #9fb3c8;
    border-color: #3a434d;
  }
  .lvlBtn.active {
    color: #9fe8c8;
    border-color: #5fd6a8;
    background: #10201a;
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>CV SPACE CRUISE (proof of concept)</h1>
  <div id="levelTabs">
    <button id="lvl1Btn" class="lvlBtn">LEVEL 1</button>
    <button id="lvl2Btn" class="lvlBtn">LEVEL 2</button>
    <button id="lvl3Btn" class="lvlBtn">LEVEL 3</button>
  </div>
  <p class="hint" id="hint">Drag the cable, steer the ship.</p>
  <canvas id="game" width="1500" height="1100"></canvas>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const GAME_H = 880;
const PANEL_Y0 = GAME_H;
const PANEL_H = H - GAME_H;

// ---------- Level state ----------
let level = 1;

function updateLevelButtons() {
  document.getElementById('lvl1Btn').classList.toggle('active', level === 1);
  document.getElementById('lvl2Btn').classList.toggle('active', level === 2);
  document.getElementById('lvl3Btn').classList.toggle('active', level === 3);
}

const HINT = 'Drag the cable, steer the ship.';
const HINT_NO_CABLE = HINT + ' (click and drag from OUT to get a cable)';

// a cable is on screen while it's patched into a jack or held mid-drag
function cableOnScreen() {
  if (level === 1) return connection !== null || dragging;
  if (level === 2) return connection2 !== null || dragging2;
  // level 3 has both cables live
  return connection !== null || dragging || connection2 !== null || dragging2;
}

let hintShown = null;
function updateHintText() {
  const text = cableOnScreen() ? HINT : HINT_NO_CABLE;
  if (text === hintShown) return;
  document.getElementById('hint').textContent = text;
  hintShown = text;
}

function setLevel(n) {
  level = n;
  updateLevelButtons();
  restart();
}

document.getElementById('lvl1Btn').addEventListener('click', () => setLevel(1));
document.getElementById('lvl2Btn').addEventListener('click', () => setLevel(2));
document.getElementById('lvl3Btn').addEventListener('click', () => setLevel(3));

// ---------- Jack layout (level 1: LFO) ----------
const lfoOutJack = { x: 150, y: PANEL_Y0 + 160, r: 13 };
const rateSlider = { x0: 60, x1: 240, y: PANEL_Y0 + 90, handle: 0.35 }; // handle: 0..1 position
const RATE_MIN = 0.05, RATE_MAX = 1.0;

// ---------- Jack layout (level 2 + 3: step buttons) ----------
// One module output; the + / − buttons raise/lower the single voltage it emits.
// In level 3 the sine module keeps the left slot, so the step module shifts right
// by stepDX(). All step geometry is derived through accessors so hit-testing and
// drawing stay in sync. In level 3 the step voltage is positive-only (stepMin 0).
const STEP = 0.1;
function stepDX() { return level === 3 ? 300 : 0; }
function stepBoxX() { return 30 + stepDX(); }
function stepMin() { return level === 3 ? 0 : -1; }
function plusButton()  { const d = stepDX(); return { x0: 50 + d,  y0: PANEL_Y0 + 55, x1: 145 + d, y1: PANEL_Y0 + 95 }; }
function minusButton() { const d = stepDX(); return { x0: 155 + d, y0: PANEL_Y0 + 55, x1: 250 + d, y1: PANEL_Y0 + 95 }; }
function stepOutJack()  { const d = stepDX(); return { x: 205 + d, y: PANEL_Y0 + 160, r: 13 }; }

// ---------- Shared input jacks ----------
const inputJacks = {
  aimLR:  { x: 650, y: PANEL_Y0 + 160, r: 13, label: '← →' },
  thrust: { x: 950, y: PANEL_Y0 + 160, r: 13, label: '↑ ↓' },
};

// ---------- Patch state (level 1) ----------
let connection = null; // 'aimLR' | 'thrust' | null
let dragging = false;
let dragPos = { x: 0, y: 0 };
let draggingRate = false;

// persistent held value (aim holds its last value; thrust is recomputed fresh every
// frame — signed -1..1, negative = reverse thrust)
let aimLR = 0;

let lfoPhase = 0;

function currentRate() {
  return RATE_MIN + rateSlider.handle * (RATE_MAX - RATE_MIN);
}

// ---------- Patch state (level 2) ----------
let connection2 = null; // 'aimLR' | 'thrust' | null — single cable, like level 1
let dragging2 = false;
let dragPos2 = { x: 0, y: 0 };

// the module's single output voltage, nudged by the + / − buttons (signed -1..1)
let stepVoltage = 0;

// ---------- Ship state ----------
// r is a visual anchor only — it places the flame at the engine and sizes the
// gimbal indicator. Collision uses SHIP_HIT, which follows the sprite's outline.
const ship = {
  x: W / 2, y: GAME_H / 2, vx: 0, vy: 0, r: 16,
};
const FORCE_SCALE = 260;
const DRAG = 0.6; // linear damping coefficient
const AIM_MAX = 1.0;

const SHIP_START = { x: W / 2, y: GAME_H - 60 };

function resetShip() {
  ship.x = SHIP_START.x; ship.y = SHIP_START.y; ship.vx = 0; ship.vy = 0;
}

function resetLevel1Controls() {
  aimLR = 0;
  connection = null;
  dragging = false;
  draggingRate = false;
}

function resetLevel2Controls() {
  aimLR = 0;
  stepVoltage = 0;
  connection2 = 'aimLR'; // start with the cable already patched into AIM L/R
  dragging2 = false;
}

// level 3: both modules present, both cables start unpatched so the player works
// out the pairing (sine → oscillating aim, positive-only step → steady thrust)
function resetLevel3Controls() {
  aimLR = 0;
  connection = null;
  dragging = false;
  draggingRate = false;
  stepVoltage = 0;
  connection2 = null;
  dragging2 = false;
}

// ---------- Asteroid field + goal (static layout, regenerated each run) ----------
let asteroids = [];
const goal = { x: W / 2, y: 70, r: 22 };
// level 3 chains two goals: reach GOAL 1/2 to reveal GOAL 2/2 (the final one)
const goal2 = { x: W / 2, y: 70, r: 22 };
let goalStage = 1; // 1 = seeking first goal, 2 = seeking final goal (level 3 only)

// goals spawn anywhere from the top edge (as the game originally did) down to the
// middle of the field, for variety
function randomGoalY() { return 65 + Math.random() * (GAME_H * 0.42 - 65); }

function generateField() {
  goal.x = 110 + Math.random() * (W - 220);
  goal.y = randomGoalY();

  // level 3's final goal: its own top-to-middle spawn, pushed to the far side
  goal2.x = 110 + Math.random() * (W - 220);
  goal2.y = randomGoalY();
  if (Math.abs(goal2.x - goal.x) < 300) {
    goal2.x = clamp(goal.x > W / 2 ? goal.x - 360 : goal.x + 360, 110, W - 110);
  }

  asteroids = [];
  const count = 34;
  let attempts = 0;
  while (asteroids.length < count && attempts < 500) {
    attempts++;
    const r = 14 + Math.random() * 24;
    const x = r + Math.random() * (W - 2 * r);
    const y = 130 + Math.random() * (GAME_H - 130 - 130);

    if (dist(x, y, SHIP_START.x, SHIP_START.y) < r + 90) continue;
    if (dist(x, y, goal.x, goal.y) < r + 90) continue;
    if (level === 3 && dist(x, y, goal2.x, goal2.y) < r + 90) continue;

    let overlaps = false;
    for (const a of asteroids) {
      if (dist(x, y, a.x, a.y) < r + a.r + 20) { overlaps = true; break; }
    }
    if (overlaps) continue;

    // crop is stored normalised (0..1) because the source images may not have
    // loaded yet when the field is generated
    const cs = SLICE_MIN + Math.random() * (SLICE_MAX - SLICE_MIN);
    asteroids.push({
      x, y, r,
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - 0.5) * 0.7,
      tex: Math.floor(Math.random() * texImgs.length),
      cs,
      cu: Math.random() * (1 - cs),
      cv: Math.random() * (1 - cs),
    });
  }
}

// ---------- Art assets ----------
// Both sprites are 896x896. The ship's opaque pixels occupy a 776x726 box centred
// in that square, so scaling off the full image keeps it centred on ship.x/y.
const shipImg = new Image();
shipImg.src = 'assets/ship.png';
const spaceImg = new Image();
spaceImg.src = 'assets/space.png';
const titleImg = new Image();
titleImg.src = 'assets/title.jpg';

// Asteroid texture sources. Each rock clips a random slice of one of these to its
// polygon silhouette, so every asteroid is unique per run without hand-drawn art.
const texImgs = ['brine.jpg', 'greed.jpg', 'leftleg.jpg', 'fish.jpg', 'steve.jpg'].map(f => {
  const im = new Image();
  im.src = 'assets/tex/' + f;
  return im;
});

// Slice size as a fraction of the source image's smaller side. Tuned by eye: small
// slices land on flat regions (card borders, water) and read as anonymous coloured
// gems, so these are deliberately large enough to catch a whole feature.
const SLICE_MIN = 0.45, SLICE_MAX = 0.75;

let SHIP_CONTENT_H = 42;                            // on-screen height of the hull
let SHIP_DRAW = SHIP_CONTENT_H * 896 / 726;         // full-image size that yields it

// the art is near-black on a near-black nebula, so it needs help to read.
// 'glow' = rim light, 'bright' = lift the sprite's own values, 'none' = raw art.
let SHIP_LIFT = 'bright';

let SHOW_HITBOX = false;

// Collision shape, measured off the sprite's alpha channel. The hull is a narrow
// fuselage (half-width ~7.3) with thin swept wings that only exist below the
// midline, so a single circle either ignores the wings or invents collisions in
// the empty upper corners. Offsets/radii are in game px at HIT_REF_H and scale
// with SHIP_CONTENT_H. Only the right wing is listed; the left is mirrored.
const HIT_REF_H = 42;
const SHIP_HIT_BASE = [
  { x: 0,    y: -13.5, r: 6.8 },
  { x: 0,    y: -6,    r: 7.3 },
  { x: 0,    y: 1,     r: 7.3 },
  { x: 0,    y: 8,     r: 7.6 },
  { x: 0,    y: 14,    r: 6.5 },
  { x: 9.5,  y: 12.4,  r: 4.3 },
  { x: 13,   y: 14.2,  r: 3.3 },
  { x: 16.5, y: 16.2,  r: 2.6 },
  { x: 20,   y: 18.2,  r: 1.9 },
  { x: 22,   y: 19.4,  r: 1.5 },
];
const SHIP_HIT = SHIP_HIT_BASE.concat(
  SHIP_HIT_BASE.filter(c => c.x > 0).map(c => ({ x: -c.x, y: c.y, r: c.r }))
);

// asteroids draw as spiky polygons whose points ride between 0.8 and 1.05 of a.r,
// so collide against their average silhouette rather than the bounding radius
const ASTEROID_HIT_SCALE = 0.9;

function hitScale() { return SHIP_CONTENT_H / HIT_REF_H; }

// true when any part of the hull overlaps the given circle
function shipOverlaps(cx, cy, cr) {
  const k = hitScale();
  for (const c of SHIP_HIT) {
    if (dist(ship.x + c.x * k, ship.y + c.y * k, cx, cy) < cr + c.r * k) return true;
  }
  return false;
}

// ---------- Stars ----------
const stars = [];
for (let i = 0; i < 70; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * GAME_H,
    r: 1 + Math.random() * 2.4,
    a: 0.2 + Math.random() * 0.5,
  });
}

// ---------- Game state ----------
let started = false; // title screen until the player clicks in
let finished = null; // null | 'crashed' | 'goal'
let elapsed = 0;
let lastTime = performance.now();

// ---------- Leaderboard (per-level arcade high scores, saved in localStorage) ----------
const LB_KEY = 'cvSpaceCruiseScores';
const LB_SIZE = 5; // top times kept per level
let enteringName = false;         // true while the player is patching in their initials
let entryInitials = ['A', 'A', 'A'];
let entryTime = 0;                // the run time being recorded
let lastEntry = null;             // { lvl, n, t } — highlights the freshly-added row

// Initials are entered with the sine wave: patch its OUT into a letter jack and the
// voltage sets that slot's letter (A..Z); patch it into SAVE to submit once the
// voltage goes positive.
let entryConn = null;             // null | 'l0' | 'l1' | 'l2' | 'enter'
let entryDragging = false;
let entryDragPos = { x: 0, y: 0 };
const entryJacks = {
  l0:    { x: 520,  y: PANEL_Y0 + 160, r: 13, label: 'LTR 1' },
  l1:    { x: 720,  y: PANEL_Y0 + 160, r: 13, label: 'LTR 2' },
  l2:    { x: 920,  y: PANEL_Y0 + 160, r: 13, label: 'LTR 3' },
  enter: { x: 1180, y: PANEL_Y0 + 160, r: 13, label: 'SAVE' },
};

function loadBoards() {
  try { return JSON.parse(localStorage.getItem(LB_KEY)) || {}; }
  catch (e) { return {}; }
}
function getBoard(lvl) {
  const all = loadBoards();
  return (all[lvl] || []).slice().sort((a, b) => a.t - b.t).slice(0, LB_SIZE);
}
// a time earns a spot if the board isn't full or it beats the current slowest
function qualifies(lvl, t) {
  const board = getBoard(lvl);
  return board.length < LB_SIZE || t < board[board.length - 1].t;
}
function addScore(lvl, initials, t) {
  const all = loadBoards();
  const arr = (all[lvl] || []).concat([{ n: initials, t: t }]);
  arr.sort((a, b) => a.t - b.t);
  all[lvl] = arr.slice(0, LB_SIZE);
  try { localStorage.setItem(LB_KEY, JSON.stringify(all)); } catch (e) {}
  lastEntry = { lvl: lvl, n: initials, t: t };
}

// called the moment a run is won; opens initials entry if the time makes the board
function winRun() {
  finished = 'goal';
  entryTime = elapsed;
  if (qualifies(level, entryTime)) {
    enteringName = true;
    entryInitials = ['A', 'A', 'A'];
    entryConn = null;
    entryDragging = false;
  }
}

function restart() {
  elapsed = 0;
  finished = null;
  enteringName = false;
  entryConn = null;
  entryDragging = false;
  goalStage = 1;
  resetShip();
  if (level === 1) resetLevel1Controls();
  else if (level === 2) resetLevel2Controls();
  else resetLevel3Controls();
  generateField();
}

// ---------- Input handling ----------
function getMousePos(evt) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (evt.clientX - rect.left) * (canvas.width / rect.width),
    y: (evt.clientY - rect.top) * (canvas.height / rect.height),
  };
}

function dist(ax, ay, bx, by) {
  return Math.hypot(ax - bx, ay - by);
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function pointInRect(p, r) {
  return p.x >= r.x0 && p.x <= r.x1 && p.y >= r.y0 && p.y <= r.y1;
}

canvas.addEventListener('mousedown', (e) => {
  const p = getMousePos(e);

  if (!started) {
    started = true;
    restart();
    return;
  }

  if (enteringName) {
    // initials are patched in with the sine wave, not typed
    const handleX = rateSlider.x0 + rateSlider.handle * (rateSlider.x1 - rateSlider.x0);
    if (Math.abs(p.x - handleX) < 12 && Math.abs(p.y - rateSlider.y) < 12) {
      draggingRate = true;
      return;
    }
    // grab a fresh cable from the sine OUT jack
    if (dist(p.x, p.y, lfoOutJack.x, lfoOutJack.y) < lfoOutJack.r + 6) {
      entryDragging = true; entryDragPos = p; entryConn = null;
      return;
    }
    // grab the cable back off the jack it's patched into
    if (entryConn && dist(p.x, p.y, entryJacks[entryConn].x, entryJacks[entryConn].y) < entryJacks[entryConn].r + 6) {
      entryDragging = true; entryDragPos = p; entryConn = null;
      return;
    }
    return;
  }

  if (finished) {
    if (finished === 'goal' && level === 1) {
      setLevel(2);
    } else if (finished === 'goal' && level === 2) {
      setLevel(3);
    } else {
      restart();
    }
    return;
  }

  // sine-wave module is present in levels 1 and 3
  if (level === 1 || level === 3) {
    // rate slider handle
    const handleX = rateSlider.x0 + rateSlider.handle * (rateSlider.x1 - rateSlider.x0);
    if (Math.abs(p.x - handleX) < 12 && Math.abs(p.y - rateSlider.y) < 12) {
      draggingRate = true;
      return;
    }

    // grab from LFO out jack
    if (dist(p.x, p.y, lfoOutJack.x, lfoOutJack.y) < lfoOutJack.r + 6) {
      dragging = true;
      dragPos = p;
      connection = null; // picking up detaches current connection
      return;
    }

    // grab existing cable at its connected jack
    if (connection && dist(p.x, p.y, inputJacks[connection].x, inputJacks[connection].y) < inputJacks[connection].r + 6) {
      dragging = true;
      dragPos = p;
      connection = null;
      return;
    }
  }

  // step-control module is present in levels 2 and 3
  if (level === 2 || level === 3) {
    const plus = plusButton(), minus = minusButton(), soj = stepOutJack();

    // step buttons raise/lower the module's single output voltage
    if (pointInRect(p, plus)) {
      stepVoltage = clamp(stepVoltage + STEP, stepMin(), 1);
      return;
    }
    if (pointInRect(p, minus)) {
      stepVoltage = clamp(stepVoltage - STEP, stepMin(), 1);
      return;
    }

    // grab from the module out jack
    if (dist(p.x, p.y, soj.x, soj.y) < soj.r + 6) {
      dragging2 = true;
      dragPos2 = p;
      connection2 = null; // picking up detaches current connection
      return;
    }

    // grab the existing cable at its connected input jack
    if (connection2 && dist(p.x, p.y, inputJacks[connection2].x, inputJacks[connection2].y) < inputJacks[connection2].r + 6) {
      dragging2 = true;
      dragPos2 = p;
      connection2 = null;
      return;
    }
  }
});

canvas.addEventListener('mousemove', (e) => {
  const p = getMousePos(e);
  if (draggingRate) {
    let t = (p.x - rateSlider.x0) / (rateSlider.x1 - rateSlider.x0);
    rateSlider.handle = Math.max(0, Math.min(1, t));
  }
  if (dragging) dragPos = p;
  if (dragging2) dragPos2 = p;
  if (entryDragging) entryDragPos = p;
});

window.addEventListener('mouseup', (e) => {
  const p = getMousePos(e);

  if (dragging) {
    let landed = null;
    for (const key in inputJacks) {
      const j = inputJacks[key];
      if (dist(p.x, p.y, j.x, j.y) < j.r + 10) { landed = key; break; }
    }
    connection = landed;
    dragging = false;
  }
  draggingRate = false;

  if (dragging2) {
    let landed = null;
    for (const key in inputJacks) {
      const j = inputJacks[key];
      if (dist(p.x, p.y, j.x, j.y) < j.r + 10) { landed = key; break; }
    }
    connection2 = landed;
    dragging2 = false;
  }

  if (entryDragging) {
    let landed = null;
    for (const key in entryJacks) {
      const j = entryJacks[key];
      if (dist(p.x, p.y, j.x, j.y) < j.r + 10) { landed = key; break; }
    }
    entryConn = landed;
    entryDragging = false;
  }
});

// ---------- Physics ----------
function applyForces(dt, aimVal, thrustMag) {
  // flame direction (points "away" from ship, thrust pushes opposite); gimbal only
  // sweeps left/right now, always keeping a fixed downward component
  let fx = aimVal * AIM_MAX;
  let fy = 1;
  const flen = Math.hypot(fx, fy) || 1;
  fx /= flen; fy /= flen;

  const forceX = -fx * thrustMag * FORCE_SCALE;
  const forceY = -fy * thrustMag * FORCE_SCALE;

  ship.vx += forceX * dt;
  ship.vy += forceY * dt;

  // linear damping
  ship.vx -= ship.vx * DRAG * dt;
  ship.vy -= ship.vy * DRAG * dt;

  ship.x += ship.vx * dt;
  ship.y += ship.vy * dt;

  // stash last computed thrust visuals for drawing
  ship._flameX = fx;
  ship._flameY = fy;
  ship._thrustMag = thrustMag;
}

function updateWorldCommon(dt) {
  // outer boundary is lethal — hitting a wall is a crash, so it can't be used as a
  // backboard to line up on the goal. The hull is wider than it is tall and sits
  // off-centre vertically, so test against its real extents rather than one radius.
  const k = hitScale();
  const halfW = 22.4 * k, topY = 19 * k, botY = 20.4 * k;
  if (ship.x < halfW || ship.x > W - halfW || ship.y < topY || ship.y > GAME_H - botY) {
    // pin the wreck at the wall so the crash reads, then end the run
    ship.x = clamp(ship.x, halfW, W - halfW);
    ship.y = clamp(ship.y, topY, GAME_H - botY);
    finished = 'crashed';
  }

  // asteroids (static field — just spin in place)
  for (const a of asteroids) {
    a.rot += a.vrot * dt;
  }

  for (const a of asteroids) {
    if (shipOverlaps(a.x, a.y, a.r * ASTEROID_HIT_SCALE)) {
      finished = 'crashed';
      break;
    }
  }

  if (!finished) {
    if (level === 3) {
      // first goal only advances the stage; the final goal ends the run
      if (goalStage === 1) {
        if (shipOverlaps(goal.x, goal.y, goal.r)) goalStage = 2;
      } else if (shipOverlaps(goal2.x, goal2.y, goal2.r)) {
        winRun();
      }
    } else if (shipOverlaps(goal.x, goal.y, goal.r)) {
      winRun();
    }
  }
}

// during initials entry the sine wave keeps oscillating; its voltage drives the
// patched letter slot, and patching SAVE submits once the voltage swings positive
function stepEntry(dt) {
  lfoPhase += currentRate() * dt * Math.PI * 2;
  const v = Math.sin(lfoPhase);
  ship._lfoValue = v; // feeds the OUT meter
  if (entryConn === 'l0' || entryConn === 'l1' || entryConn === 'l2') {
    const slot = +entryConn[1];
    const idx = Math.round((v + 1) / 2 * 25); // -1..+1 V -> A..Z
    entryInitials[slot] = String.fromCharCode(65 + idx);
  } else if (entryConn === 'enter' && v > 0) {
    addScore(level, entryInitials.join(''), entryTime);
    enteringName = false;
    entryConn = null;
  }
}

function step(dt) {
  if (enteringName) { stepEntry(dt); return; }
  if (!started || finished) return;
  elapsed += dt;

  if (level === 1) {
    lfoPhase += currentRate() * dt * Math.PI * 2;
    const lfoValue = Math.sin(lfoPhase);

    if (connection === 'aimLR') aimLR = lfoValue;
    // signed: -1..1, negative fires the thruster in reverse
    const thrustMag = connection === 'thrust' ? lfoValue : 0;

    applyForces(dt, aimLR, thrustMag);
    ship._lfoValue = lfoValue;
  } else if (level === 2) {
    // single output voltage drives whichever input the one cable is patched to;
    // aim holds its last value when the cable moves away (same as level 1)
    if (connection2 === 'aimLR') aimLR = stepVoltage;
    const thrustMag = connection2 === 'thrust' ? stepVoltage : 0;

    applyForces(dt, aimLR, thrustMag);
  } else {
    // level 3: sine wave and (positive-only) step control are both live. Each
    // cable drives its patched input; if both land on the same input the step
    // control wins (evaluated last).
    lfoPhase += currentRate() * dt * Math.PI * 2;
    const lfoValue = Math.sin(lfoPhase);

    let thrustMag = 0;
    if (connection === 'aimLR') aimLR = lfoValue;
    if (connection === 'thrust') thrustMag = lfoValue;
    if (connection2 === 'aimLR') aimLR = stepVoltage;
    if (connection2 === 'thrust') thrustMag = stepVoltage;

    applyForces(dt, aimLR, thrustMag);
    ship._lfoValue = lfoValue;
  }

  updateWorldCommon(dt);
}

// ---------- Drawing ----------
// Cover-fit the 896x896 starfield across the 1300x760 play area, then knock it back
// slightly so asteroids and the goal ring stay readable against the nebula.
function drawBackground() {
  if (!spaceImg.complete || !spaceImg.naturalWidth) { drawStars(); return; }
  const scale = Math.max(W / spaceImg.naturalWidth, GAME_H / spaceImg.naturalHeight);
  const dw = spaceImg.naturalWidth * scale;
  const dh = spaceImg.naturalHeight * scale;
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, W, GAME_H);
  ctx.clip();
  ctx.drawImage(spaceImg, (W - dw) / 2, (GAME_H - dh) / 2, dw, dh);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(0, 0, W, GAME_H);
  ctx.restore();
}

function drawStars() {
  ctx.save();
  for (const s of stars) {
    ctx.globalAlpha = s.a;
    ctx.fillStyle = '#9fb3c8';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function asteroidPath(a) {
  ctx.beginPath();
  const spikes = 8;
  for (let i = 0; i < spikes; i++) {
    const ang = (i / spikes) * Math.PI * 2;
    const rr = a.r * (0.8 + 0.25 * Math.sin(i * 2.1 + a.rot));
    const x = Math.cos(ang) * rr, y = Math.sin(ang) * rr;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function drawAsteroids() {
  for (const a of asteroids) {
    const img = texImgs[a.tex];
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);
    asteroidPath(a);

    if (img.complete && img.naturalWidth) {
      ctx.save();
      ctx.clip();
      // square crop off the source's smaller side keeps the slice unstretched
      const side = Math.min(img.naturalWidth, img.naturalHeight);
      const sw = a.cs * side;
      ctx.drawImage(
        img,
        a.cu * (img.naturalWidth - sw), a.cv * (img.naturalHeight - sw), sw, sw,
        -a.r, -a.r, a.r * 2, a.r * 2
      );
      // darken toward the rim so a flat slice reads as a solid lump
      const vig = ctx.createRadialGradient(0, 0, a.r * 0.25, 0, 0, a.r * 1.05);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(0,0,0,0.72)');
      ctx.fillStyle = vig;
      ctx.fillRect(-a.r, -a.r, a.r * 2, a.r * 2);
      ctx.restore();
    } else {
      ctx.fillStyle = '#3a3f45';
      ctx.fill();
    }

    ctx.strokeStyle = 'rgba(150,165,180,0.55)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }
}

function drawGoalRing(g, label) {
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 260);
  ctx.save();
  ctx.strokeStyle = `rgba(120, 230, 170, ${0.6 + 0.4 * pulse})`;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(g.x, g.y, g.r + pulse * 4, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = '#78e6aa';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = '#9fb3c8';
  ctx.font = '11px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(label, g.x, g.y - g.r - 10);
  ctx.textAlign = 'left';
  ctx.restore();
}

// levels 1/2 have one plain goal; level 3 chains GOAL 1/2 → GOAL 2/2
function drawGoals() {
  if (level === 3) {
    if (goalStage === 1) drawGoalRing(goal, 'GOAL 1/2');
    else drawGoalRing(goal2, 'GOAL 2/2');
  } else {
    drawGoalRing(goal, 'GOAL');
  }
}

function drawShip() {
  const flameAngle = Math.atan2(ship._flameY || 1, ship._flameX || 0);
  ctx.save();
  ctx.translate(ship.x, ship.y);

  // flame — orange fires from the nozzle (forward push), cyan fires from the
  // opposite side (reverse thrust)
  const signedMag = ship._thrustMag || 0;
  const mag = Math.abs(signedMag);
  if (mag > 0.02) {
    const reversed = signedMag < 0;
    ctx.save();
    ctx.rotate(flameAngle - Math.PI / 2 + (reversed ? Math.PI : 0));
    const len = 14 + mag * 34;
    const grad = ctx.createLinearGradient(0, ship.r, 0, ship.r + len);
    if (reversed) {
      grad.addColorStop(0, `rgba(130,210,255,${0.9 * mag})`);
      grad.addColorStop(1, `rgba(40,110,255,0)`);
    } else {
      grad.addColorStop(0, `rgba(255,220,120,${0.9 * mag})`);
      grad.addColorStop(1, `rgba(255,60,20,0)`);
    }
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-6, ship.r);
    ctx.lineTo(6, ship.r);
    ctx.lineTo(0, ship.r + len);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // hull sprite (fixed orientation pointing up)
  if (shipImg.complete && shipImg.naturalWidth) {
    ctx.save();
    if (SHIP_LIFT === 'glow') {
      ctx.shadowColor = 'rgba(150,200,230,0.75)';
      ctx.shadowBlur = 10;
    } else if (SHIP_LIFT === 'bright') {
      ctx.filter = 'brightness(2.1) contrast(1.15)';
    }
    ctx.drawImage(shipImg, -SHIP_DRAW / 2, -SHIP_DRAW / 2, SHIP_DRAW, SHIP_DRAW);
    ctx.restore();
  } else {
    ctx.fillStyle = '#aab4bd';
    ctx.beginPath();
    ctx.arc(0, 0, ship.r, 0, Math.PI * 2);
    ctx.fill();
  }

  if (SHOW_HITBOX) {
    const k = hitScale();
    ctx.strokeStyle = 'rgba(95,214,168,0.9)';
    ctx.lineWidth = 1;
    for (const c of SHIP_HIT) {
      ctx.beginPath();
      ctx.arc(c.x * k, c.y * k, c.r * k, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // little direction indicator for the gimbal aim (nozzle tip)
  ctx.strokeStyle = '#ffcf6b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, ship.r * 0.75);
  ctx.lineTo((ship._flameX || 0) * 22, ship.r * 0.75 + (ship._flameY || 1) * 22);
  ctx.stroke();

  ctx.restore();
}

function drawJack(j, connected) {
  ctx.beginPath();
  ctx.arc(j.x, j.y, j.r, 0, Math.PI * 2);
  ctx.fillStyle = connected ? '#2c5b4a' : '#151a20';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = connected ? '#5fd6a8' : '#5a6572';
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(j.x, j.y, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#0a0d10';
  ctx.fill();
}

function drawMeter(x, y, value01, label) {
  // value01 expected in -1..1 range mapped to bar fill
  const w = 14, h = 46;
  ctx.strokeStyle = '#3a434d';
  ctx.strokeRect(x - w / 2, y - h, w, h);
  const norm = clamp((value01 + 1) / 2, 0, 1);
  const fillH = norm * h;
  ctx.fillStyle = '#5fb0d6';
  ctx.fillRect(x - w / 2, y - fillH, w, fillH);
}

function drawCable(x0, y0, x1, y1) {
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  const midY = (y0 + y1) / 2 + 30;
  ctx.bezierCurveTo(x0, midY, x1, midY, x1, y1);
  ctx.stroke();
}

function drawStepButton(btn, label, active) {
  ctx.fillStyle = active ? '#1d2b24' : '#151a20';
  ctx.strokeStyle = active ? '#5fd6a8' : '#3a434d';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.rect(btn.x0, btn.y0, btn.x1 - btn.x0, btn.y1 - btn.y0);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#cfd6de';
  ctx.font = '22px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(label, (btn.x0 + btn.x1) / 2, (btn.y0 + btn.y1) / 2 + 8);
  ctx.textAlign = 'left';
}

function drawInputJacks(highlight) {
  for (const key in inputJacks) {
    const j = inputJacks[key];
    const active = highlight(key);
    drawJack(j, active);
    ctx.fillStyle = active ? '#9fe8c8' : '#6d7885';
    ctx.font = '18px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(j.label, j.x, j.y - 24);
    ctx.textAlign = 'left';
  }
}

function drawPanelBase() {
  ctx.fillStyle = '#0c0f13';
  ctx.fillRect(0, PANEL_Y0, W, PANEL_H);
  ctx.strokeStyle = '#22282f';
  ctx.beginPath();
  ctx.moveTo(0, PANEL_Y0);
  ctx.lineTo(W, PANEL_Y0);
  ctx.stroke();
}

// The sine-wave (LFO) module — fixed left slot, used by levels 1 and 3 (and the
// initials-entry screen, which passes its own OUT-jack lit state).
function drawSineModuleUI(outPatched) {
  ctx.strokeStyle = '#2a323b';
  ctx.strokeRect(30, PANEL_Y0 + 20, 240, PANEL_H - 40);
  ctx.fillStyle = '#8fa2b3';
  ctx.font = '13px Courier New';
  ctx.fillText('THE SINE WAVE', 45, PANEL_Y0 + 45);

  // rate slider
  ctx.strokeStyle = '#3a434d';
  ctx.beginPath();
  ctx.moveTo(rateSlider.x0, rateSlider.y);
  ctx.lineTo(rateSlider.x1, rateSlider.y);
  ctx.stroke();
  const handleX = rateSlider.x0 + rateSlider.handle * (rateSlider.x1 - rateSlider.x0);
  ctx.beginPath();
  ctx.arc(handleX, rateSlider.y, 8, 0, Math.PI * 2);
  ctx.fillStyle = '#e0b45a';
  ctx.fill();
  ctx.fillStyle = '#6d7885';
  ctx.font = '11px Courier New';
  ctx.fillText('RATE', rateSlider.x0, rateSlider.y - 16);

  // lfo live value meter + out jack
  drawMeter(lfoOutJack.x - 45, PANEL_Y0 + 190, ship._lfoValue || 0, '');
  const outLit = outPatched !== undefined ? outPatched : (connection !== null || dragging);
  drawJack(lfoOutJack, outLit);
  ctx.fillStyle = '#6d7885';
  ctx.fillText('OUT', lfoOutJack.x - 12, PANEL_Y0 + 195);
}

// The step-control module — position follows stepDX() (shifts right in level 3).
function drawStepModuleUI() {
  const bx = stepBoxX();
  const soj = stepOutJack();

  ctx.strokeStyle = '#2a323b';
  ctx.strokeRect(bx, PANEL_Y0 + 20, 240, PANEL_H - 40);
  ctx.fillStyle = '#8fa2b3';
  ctx.font = '13px Courier New';
  ctx.fillText('STEP CONTROL', bx + 15, PANEL_Y0 + 45);

  drawStepButton(plusButton(), '+', false);
  drawStepButton(minusButton(), '−', false);

  // single voltage meter for the module's output, plus its readout
  drawMeter(soj.x - 45, PANEL_Y0 + 190, stepVoltage, '');
  ctx.fillStyle = '#6d7885';
  ctx.font = '11px Courier New';
  ctx.fillText(stepVoltage.toFixed(2) + ' V', bx + 15, PANEL_Y0 + 130);

  // module out jack
  drawJack(soj, connection2 !== null || dragging2);
  ctx.fillStyle = '#6d7885';
  ctx.fillText('OUT', soj.x - 12, soj.y + 28);
}

function drawSineCable() {
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#4a9dd6';
  if (connection) drawCable(lfoOutJack.x, lfoOutJack.y, inputJacks[connection].x, inputJacks[connection].y);
  if (dragging) drawCable(lfoOutJack.x, lfoOutJack.y, dragPos.x, dragPos.y);
}

function drawStepCable(color) {
  const soj = stepOutJack();
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.strokeStyle = color;
  if (connection2) drawCable(soj.x, soj.y, inputJacks[connection2].x, inputJacks[connection2].y);
  if (dragging2) drawCable(soj.x, soj.y, dragPos2.x, dragPos2.y);
}

function drawPanelLevel1() {
  ctx.save();
  drawPanelBase();
  drawSineModuleUI();

  drawInputJacks((key) => connection === key);
  drawMeter(inputJacks.aimLR.x - 45, PANEL_Y0 + 190, aimLR, '');
  drawMeter(inputJacks.thrust.x - 45, PANEL_Y0 + 190, (connection === 'thrust' ? (ship._lfoValue || 0) : -1), '');

  drawSineCable();
  ctx.restore();
}

function drawPanelLevel2() {
  ctx.save();
  drawPanelBase();
  drawStepModuleUI();

  // input jacks (no per-input meters now)
  drawInputJacks((key) => connection2 === key);

  drawStepCable('#4a9dd6');
  ctx.restore();
}

function drawPanelLevel3() {
  ctx.save();
  drawPanelBase();
  drawSineModuleUI();
  drawStepModuleUI();

  // both cables can be patched, so a jack is lit if either module feeds it
  drawInputJacks((key) => connection === key || connection2 === key);
  drawMeter(inputJacks.aimLR.x - 45, PANEL_Y0 + 190, aimLR, '');
  const thrustLevel = connection2 === 'thrust' ? stepVoltage
                    : connection === 'thrust' ? (ship._lfoValue || 0)
                    : -1;
  drawMeter(inputJacks.thrust.x - 45, PANEL_Y0 + 190, thrustLevel, '');

  // distinct cable colours so the two patches are easy to tell apart
  drawSineCable();          // blue = sine wave
  drawStepCable('#d6a84a'); // amber = step control
  ctx.restore();
}

// The title art is 4:3 and the play area is wider, so contain-fit it — cover-fit
// would crop the lettering off the top and bottom.
function drawTitle() {
  ctx.save();
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, GAME_H);
  if (titleImg.complete && titleImg.naturalWidth) {
    const scale = Math.min(W / titleImg.naturalWidth, GAME_H / titleImg.naturalHeight);
    const dw = titleImg.naturalWidth * scale, dh = titleImg.naturalHeight * scale;
    ctx.drawImage(titleImg, (W - dw) / 2, (GAME_H - dh) / 2, dw, dh);
  }
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 340);
  ctx.font = '20px Courier New';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(W / 2 - 150, GAME_H - 58, 300, 34);
  ctx.fillStyle = `rgba(159, 232, 200, ${0.55 + 0.45 * pulse})`;
  ctx.fillText('CLICK TO START', W / 2, GAME_H - 34);
  ctx.textAlign = 'left';
  ctx.restore();
}

// arcade high-score table for one level, centred on cx with its header at topY
function drawLeaderboard(lvl, cx, topY) {
  const board = getBoard(lvl);
  ctx.textAlign = 'center';
  ctx.font = '15px Courier New';
  ctx.fillStyle = '#8fa2b3';
  ctx.fillText('— LEVEL ' + lvl + ' BEST TIMES —', cx, topY);

  ctx.font = '16px Courier New';
  const rowH = 26;
  if (board.length === 0) {
    ctx.fillStyle = '#556170';
    ctx.fillText('no times yet — be the first', cx, topY + rowH);
    ctx.textAlign = 'left';
    return;
  }
  for (let i = 0; i < board.length; i++) {
    const e = board[i];
    const isNew = lastEntry && lastEntry.lvl === lvl &&
                  lastEntry.n === e.n && Math.abs(lastEntry.t - e.t) < 1e-9;
    ctx.fillStyle = isNew ? '#9fe8c8' : '#cfd6de';
    ctx.fillText((i + 1) + '.   ' + e.n + '    ' + e.t.toFixed(2) + 's', cx, topY + rowH * (i + 1));
  }
  ctx.textAlign = 'left';
}

// the "NEW RECORD" screen with the three initial slots
function drawNameEntry() {
  const cx = W / 2, cy = GAME_H / 2;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd166';
  ctx.font = '26px Courier New';
  ctx.fillText('NEW RECORD!', cx, cy - 150);
  ctx.fillStyle = '#cfd6de';
  ctx.font = '16px Courier New';
  ctx.fillText('Level ' + level + '  —  ' + entryTime.toFixed(2) + 's', cx, cy - 118);

  const slotW = 54, gap = 20;
  const totalW = 3 * slotW + 2 * gap;
  const startX = cx - totalW / 2;
  const boxY = cy - 90, boxH = 66;
  for (let i = 0; i < 3; i++) {
    const x = startX + i * (slotW + gap);
    const active = entryConn === ('l' + i); // slot currently being driven by the cable
    ctx.strokeStyle = active ? '#5fd6a8' : '#3a434d';
    ctx.lineWidth = active ? 3 : 2;
    ctx.strokeRect(x, boxY, slotW, boxH);
    ctx.fillStyle = active ? '#9fe8c8' : '#cfd6de';
    ctx.font = '40px Courier New';
    ctx.fillText(entryInitials[i], x + slotW / 2, boxY + boxH - 18);
  }

  ctx.fillStyle = '#6d7885';
  ctx.font = '13px Courier New';
  ctx.fillText('patch the SINE WAVE into a letter jack to spin it — unplug to lock',
               cx, boxY + boxH + 30);
  ctx.fillText('then patch SAVE and wait for a positive voltage to submit',
               cx, boxY + boxH + 50);
  ctx.textAlign = 'left';
}

// Panel for the initials-entry screen: the sine module plus the four entry jacks.
function drawEntryPanel() {
  ctx.save();
  drawPanelBase();
  drawSineModuleUI(entryConn !== null || entryDragging);

  for (const key in entryJacks) {
    const j = entryJacks[key];
    const active = entryConn === key;
    drawJack(j, active);
    ctx.fillStyle = active ? '#9fe8c8' : '#6d7885';
    ctx.font = '15px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(j.label, j.x, j.y - 24);
    ctx.textAlign = 'left';
  }

  // the single patch cable
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#4a9dd6';
  if (entryConn) {
    const j = entryJacks[entryConn];
    drawCable(lfoOutJack.x, lfoOutJack.y, j.x, j.y);
  }
  if (entryDragging) {
    drawCable(lfoOutJack.x, lfoOutJack.y, entryDragPos.x, entryDragPos.y);
  }
  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = '#cfd6de';
  ctx.font = '16px Courier New';
  ctx.fillText('TIME: ' + elapsed.toFixed(1) + 's', 16, 26);
  ctx.textAlign = 'right';
  ctx.fillText('LEVEL ' + level, W - 16, 26);
  ctx.textAlign = 'left';

  if (finished) {
    const win = finished === 'goal';
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, GAME_H);

    if (enteringName) {
      drawNameEntry();
      return;
    }

    ctx.fillStyle = win ? '#78e6aa' : '#ff8f6b';
    ctx.font = '28px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(win ? 'GOAL REACHED' : 'CRASHED', W / 2, GAME_H / 2 - 150);
    ctx.font = '16px Courier New';
    ctx.fillStyle = '#cfd6de';
    const nextMsg = (win && level === 1)
      ? 'Time ' + elapsed.toFixed(1) + 's — click for LEVEL 2'
      : (win && level === 2)
      ? 'Time ' + elapsed.toFixed(1) + 's — click for LEVEL 3'
      : 'Time ' + elapsed.toFixed(1) + 's — click for a new field';
    ctx.fillText(nextMsg, W / 2, GAME_H / 2 - 118);
    drawLeaderboard(level, W / 2, GAME_H / 2 - 70);
    ctx.textAlign = 'left';
  }
}

function render() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, GAME_H);
  if (started) {
    drawBackground();
    drawGoals();
    drawAsteroids();
    drawShip();
    drawHUD();
  } else {
    drawTitle();
  }
  if (enteringName) drawEntryPanel();
  else if (level === 1) drawPanelLevel1();
  else if (level === 2) drawPanelLevel2();
  else drawPanelLevel3();
  updateHintText();
}

function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  step(dt);
  render();
  requestAnimationFrame(loop);
}

updateLevelButtons();
restart();
requestAnimationFrame(loop);
</script>
</body>
</html>
